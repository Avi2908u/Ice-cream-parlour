<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Management - Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-brown: #6b3e26;
            --soft-pink: #ffc5d9;
            --mint-green: #c2f2d0;
            --cream-yellow: #fdf5c9;
            --peach-orange: #ffcb85;
            --dark-bg: #0a0a0a;
            --glass-white: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--primary-brown) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, var(--soft-pink) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, var(--mint-green) 0%, transparent 50%),
                radial-gradient(circle at 60% 20%, var(--peach-orange) 0%, transparent 50%);
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 
                0 25px 45px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 1200px;
            min-height: 700px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                var(--soft-pink) 90deg,
                var(--mint-green) 180deg,
                var(--peach-orange) 270deg,
                transparent 360deg
            );
            opacity: 0.05;
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-page {
            display: block;
            padding: 80px 60px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .login-form {
            max-width: 450px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .login-form h1 {
            font-family: 'Orbitron', monospace;
            color: var(--cream-yellow);
            margin-bottom: 20px;
            font-size: 3.2em;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 
                0 0 20px var(--peach-orange),
                0 0 40px var(--soft-pink);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px var(--peach-orange), 0 0 40px var(--soft-pink); }
            to { text-shadow: 0 0 30px var(--peach-orange), 0 0 60px var(--soft-pink), 0 0 80px var(--mint-green); }
        }

        .subtitle {
            color: var(--mint-green);
            font-size: 1.2em;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--cream-yellow);
            font-weight: 600;
            font-size: 1.1em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-family: 'Exo 2', sans-serif;
        }

        .form-group select option {
            background: var(--primary-brown);
            color: white;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--mint-green);
            box-shadow: 
                0 0 20px rgba(194, 242, 208, 0.5),
                inset 0 0 10px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .login-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--peach-orange) 0%, var(--soft-pink) 100%);
            color: var(--primary-brown);
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            letter-spacing: 2px;
            font-family: 'Orbitron', monospace;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 35px rgba(255, 203, 133, 0.4),
                0 0 40px rgba(255, 197, 217, 0.3);
        }

        .demo-credentials {
            margin-top: 40px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            font-size: 1em;
            color: white;
            border: 1px solid var(--glass-border);
        }

        .demo-credentials p {
            margin-bottom: 8px;
            font-weight: 400;
        }

        .demo-credentials strong {
            color: var(--cream-yellow);
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            color: var(--soft-pink);
            padding: 18px;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
            font-weight: 600;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }

        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--mint-green);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                min-height: 500px;
            }
            
            .login-page {
                padding: 40px 30px;
            }
            
            .login-form h1 {
                font-size: 2.5em;
            }
        }
    </style>
</head>

<body>
    <div class="floating-particles">
        <!-- All particles stay the same -->
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 40%; animation-delay: 3s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 0.5s;"></div>
        <div class="particle" style="left: 80%; animation-delay: 1.5s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 2.5s;"></div>
    </div>

    <div class="container">
        <div class="login-page">
            <form method="POST" action="{% url 'login' %}" class="login-form">
                {% csrf_token %}
                <h1>NEXUS ICE</h1>
                <p class="subtitle">Future of Ice Cream Management</p>

                <div class="form-group">
                    <label for="userType">Access Level:</label>
                    <select name="user_type" required>
                        <option value="">Select User Type</option>
                        <option value="owner">Owner</option>
                        <option value="vendor">Vendor</option>
                        <option value="customer">Customer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="username">Username:</label>
                    <input name="username" type="text" required placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input name="password" type="password" required placeholder="Enter password">
                </div>

                <button type="submit" class="login-btn">Initialize Access</button>

                {% if error %}
                    <div class="error-message" style="display:block">{{ error }}</div>
                {% endif %}

                <div class="demo-credentials">
                    <p><strong>Demo Access Codes:</strong></p>
                    <p><strong>Owner:</strong> admin / admin123</p>
                    <p><strong>Vendor:</strong> vendor1 / vendor123</p>
                    <p><strong>Customer:</strong> customer1 / customer123</p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
