<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Shop - Product Display</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-brown: #6b3e26;
            --soft-pink: #ffc5d9;
            --mint-green: #c2f2d0;
            --cream-yellow: #fdf5c9;
            --peach-orange: #ffcb85;
            --dark-bg: #0a0a0a;
            --glass-white: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--primary-brown) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, var(--soft-pink) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, var(--mint-green) 0%, transparent 50%),
                radial-gradient(circle at 60% 20%, var(--peach-orange) 0%, transparent 50%);
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 
                0 25px 45px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 1200px;
            min-height: 700px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            padding: 50px;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                var(--soft-pink) 90deg,
                var(--mint-green) 180deg,
                var(--peach-orange) 270deg,
                transparent 360deg
            );
            opacity: 0.05;
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 30px;
            font-family: 'Orbitron', monospace;
            color: var(--cream-yellow);
        }

        .logo {
            font-size: 2em;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--cream-yellow);
            text-shadow: 0 0 15px var(--peach-orange);
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: var(--cream-yellow);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--peach-orange);
        }

        .logout-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--soft-pink) 0%, var(--mint-green) 100%);
            color: var(--primary-brown);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'Exo 2', sans-serif;
            text-transform: uppercase;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 197, 217, 0.4);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 2px solid var(--glass-border);
            position: relative;
            z-index: 1;
        }

        .dashboard-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.8em;
            color: var(--cream-yellow);
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--peach-orange);
        }

        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--mint-green);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .welcome-message {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 25px;
            margin-bottom: 40px;
            text-align: center;
            color: white;
            font-size: 1.3em;
            font-weight: 300;
            letter-spacing: 1px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
        }

        .welcome-message h2 {
            font-family: 'Orbitron', monospace;
            font-size: 2.2em;
            margin-bottom: 15px;
            font-weight: 700;
            color: var(--cream-yellow);
            text-shadow: 0 0 20px var(--peach-orange);
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 2em;
            color: var(--cream-yellow);
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--peach-orange);
            position: relative;
            z-index: 1;
        }

        .customer-section {
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        .product-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .product-image {
            height: 180px;
            background: linear-gradient(135deg, var(--cream-yellow) 0%, var(--peach-orange) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.1);
        }

        .product-info {
            padding: 25px;
        }

        .product-info h3 {
            margin-bottom: 12px;
            color: var(--cream-yellow);
            font-weight: 600;
            font-size: 1.3em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .product-price {
            font-size: 1.4em;
            color: var(--mint-green);
            font-weight: 700;
            margin-bottom: 8px;
            font-family: 'Orbitron', monospace;
        }

        .product-description {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            font-weight: 300;
        }

        /* Add to Cart Button */
        .add-to-cart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: var(--mint-green);
            color: var(--primary-brown);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .add-to-cart-btn:hover {
            background: var(--peach-orange);
            color: white;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            padding: 30px;
            transition: right 0.3s ease;
            color: var(--cream-yellow);
            z-index: 100;
            overflow-y: auto;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-sidebar h3 {
            font-size: 1.6em;
            margin-bottom: 15px;
            color: var(--cream-yellow);
            font-family: 'Orbitron', monospace;
        }

        .cart-sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .cart-sidebar li {
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .cart-total {
            font-size: 1.5em;
            font-weight: 700;
            margin-top: 20px;
            color: var(--mint-green);
        }

        .cart-sidebar button {
            margin-top: 15px;
            padding: 12px 25px;
            background: var(--soft-pink);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            color: var(--primary-brown);
        }

        .cart-sidebar button:hover {
            background: var(--peach-orange);
            color: white;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            padding: 25px 0 0 0;
            border-top: 1px solid var(--glass-border);
            text-align: center;
            color: var(--cream-yellow);
            font-size: 1em;
            opacity: 0.85;
        }

        .footer a {
            color: var(--mint-green);
            margin: 0 8px;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            color: var(--peach-orange);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                min-height: 500px;
                padding: 30px 10px;
            }
            .navbar {
                flex-direction: column;
                gap: 12px;
            }
            .dashboard-title {
                font-size: 2.2em;
            }
            .product-grid {
                grid-template-columns: 1fr;
            }
            .cart-sidebar {
                width: 100vw;
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-particles">
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 40%; animation-delay: 3s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 0.5s;"></div>
        <div class="particle" style="left: 80%; animation-delay: 1.5s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 2.5s;"></div>
    </div>

    <div class="container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="logo">iSCREAM</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#" id="cart-icon" onclick="openCart()">Cart (0)</a></li>
                <li><button class="logout-btn" onclick="handleLogout()">Logout</button></li>
            </ul>
        </nav>

        <div class="dashboard-header">
            <h1 class="dashboard-title">CUSTOMER HUB</h1>
        </div>
        
        <div class="welcome-message">
            <h2>Welcome, Ice Cream Lover</h2>
            <p>Discover our premium artisanal ice cream collection</p>
        </div>

        <div class="customer-section">
            <h2 class="section-title">Available Flavors</h2>
            <div class="product-grid" id="product-grid">
                <!-- Product cards will be generated here -->
            </div>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="cart-sidebar">
        <h3>Your Cart</h3>
        <ul id="cart-items"></ul>
        <div class="cart-total">Total: $0.00</div>
        <button onclick="checkout()">Checkout</button>
        <button onclick="closeCart()">Close</button>
    </div>

    <!-- Footer -->
   
    <script>
        // Product Data
        const products = [
            {
                name: "Vanilla Ice Cream",
                price: 3.50,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f366.svg",
                desc: "Classic vanilla flavor made with real Madagascar vanilla beans"
            },
            {
                name: "Chocolate Ice Cream",
                price: 4.00,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f36b.svg",
                desc: "Rich dark chocolate ice cream with cocoa from Belgium"
            },
            {
                name: "Strawberry Ice Cream",
                price: 3.75,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f353.svg",
                desc: "Fresh strawberry ice cream with real fruit chunks"
            },
            {
                name: "Mint Chocolate Chip",
                price: 4.25,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f33f.svg",
                desc: "Refreshing mint with premium chocolate chips"
            },
            {
                name: "Rocky Road",
                price: 4.50,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1faa8.svg",
                desc: "Chocolate ice cream with marshmallows and nuts"
            },
            {
                name: "Pistachio",
                price: 4.75,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f95c.svg",
                desc: "Creamy pistachio ice cream with real nuts"
            },
            {
                name: "Cookies and Cream",
                price: 4.25,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f36a.svg",
                desc: "Vanilla ice cream with crushed chocolate cookies"
            },
            {
                name: "Caramel Swirl",
                price: 4.50,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f36f.svg",
                desc: "Creamy vanilla with rich caramel swirl throughout"
            },
            {
                name: "Mango Sorbet",
                price: 4.00,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f96d.svg",
                desc: "Refreshing dairy-free mango sorbet with tropical flavor"
            },
            {
                name: "Salted Caramel",
                price: 4.75,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f9c2.svg",
                desc: "Sweet and salty caramel ice cream with sea salt crystals"
            },
            {
                name: "Neapolitan",
                price: 4.00,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f366.svg",
                desc: "Classic trio of vanilla, chocolate, and strawberry"
            },
            {
                name: "Butter Pecan",
                price: 4.50,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f330.svg",
                desc: "Rich buttery ice cream with toasted pecan pieces"
            },
            {
                name: "Coffee Gelato",
                price: 4.25,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2615.svg",
                desc: "Authentic Italian-style coffee gelato with espresso"
            },
            {
                name: "Coconut",
                price: 4.00,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f965.svg",
                desc: "Tropical coconut ice cream with shredded coconut flakes"
            },
            {
                name: "Blueberry Cheesecake",
                price: 4.75,
                img: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1fad0.svg",
                desc: "Creamy cheesecake ice cream with blueberry swirl and graham cracker pieces"
            }
        ];

        // Render Product Cards
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            products.forEach((product, idx) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">
                        <img src="${product.img}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <p class="product-description">${product.desc}</p>
                        <button class="add-to-cart-btn" onclick="addToCart(${idx})">Add to Cart</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Cart Functionality
        let cart = [];

        function addToCart(idx) {
            const product = products[idx];
            const existing = cart.find(item => item.name === product.name);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            openCart();
        }

        function updateCartUI() {
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = '';
            let total = 0;
            cart.forEach((item, i) => {
                total += item.price * item.quantity;
                const li = document.createElement('li');
                li.innerHTML = `
                    ${item.name} x${item.quantity} - $${(item.price * item.quantity).toFixed(2)}
                    <button style="float:right; background:none; border:none; color:var(--soft-pink); font-weight:bold; cursor:pointer;" onclick="removeFromCart(${i})">&times;</button>
                `;
                cartItems.appendChild(li);
            });
            document.querySelector('.cart-total').textContent = Total: $${total.toFixed(2)};
            document.getElementById('cart-icon').textContent = Cart (${cart.reduce((a,b)=>a+b.quantity,0)});
        }

        function removeFromCart(i) {
            cart.splice(i, 1);
            updateCartUI();
        }

        function openCart() {
            document.getElementById('cart-sidebar').classList.add('open');
        }

        function closeCart() {
            document.getElementById('cart-sidebar').classList.remove('open');
        }

        function checkout() {
            if(cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            alert('Proceeding to checkout...');
            // Implement checkout logic here
        }

        function handleLogout() {
            // In a real application, this would clear session data
            window.location.href = 'login.html';
        }

        // On page load
        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
