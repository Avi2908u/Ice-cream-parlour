<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Ice Cream Management System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-brown: #6b3e26;
            --soft-pink: #ffc5d9;
            --mint-green: #c2f2d0;
            --cream-yellow: #fdf5c9;
            --peach-orange: #ffcb85;
            --dark-bg: #0a0a0a;
            --glass-white: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--primary-brown) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, var(--soft-pink) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, var(--mint-green) 0%, transparent 50%),
                radial-gradient(circle at 60% 20%, var(--peach-orange) 0%, transparent 50%);
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 
                0 25px 45px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 1200px;
            min-height: 700px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            padding: 50px;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                var(--soft-pink) 90deg,
                var(--mint-green) 180deg,
                var(--peach-orange) 270deg,
                transparent 360deg
            );
            opacity: 0.05;
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 2px solid var(--glass-border);
            position: relative;
            z-index: 1;
        }

        .dashboard-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.8em;
            color: var(--cream-yellow);
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--peach-orange);
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .cart-btn, .logout-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'Exo 2', sans-serif;
            text-transform: uppercase;
            position: relative;
        }

        .cart-btn {
            background: linear-gradient(135deg, var(--mint-green) 0%, var(--peach-orange) 100%);
            color: var(--primary-brown);
        }

        .logout-btn {
            background: linear-gradient(135deg, var(--soft-pink) 0%, var(--mint-green) 100%);
            color: var(--primary-brown);
        }

        .cart-btn:hover, .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 197, 217, 0.4);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--soft-pink);
            color: var(--primary-brown);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            min-width: 24px;
        }

        .welcome-message {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 25px;
            margin-bottom: 40px;
            text-align: center;
            color: white;
            font-size: 1.3em;
            font-weight: 300;
            letter-spacing: 1px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
        }

        .welcome-message h2 {
            font-family: 'Orbitron', monospace;
            font-size: 2.2em;
            margin-bottom: 15px;
            font-weight: 700;
            color: var(--cream-yellow);
            text-shadow: 0 0 20px var(--peach-orange);
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 2em;
            color: var(--cream-yellow);
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--peach-orange);
            position: relative;
            z-index: 1;
        }

        .customer-section {
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .product-image {
            height: 180px;
            background: linear-gradient(135deg, var(--cream-yellow) 0%, var(--peach-orange) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.1);
        }

        .product-info {
            padding: 25px;
        }

        .product-info h3 {
            margin-bottom: 12px;
            color: var(--cream-yellow);
            font-weight: 600;
            font-size: 1.3em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .product-price {
            font-size: 1.4em;
            color: var(--mint-green);
            font-weight: 700;
            margin-bottom: 8px;
            font-family: 'Orbitron', monospace;
        }

        .product-description {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            font-weight: 300;
            margin-bottom: 15px;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .add-to-cart-btn {
            flex: 1;
            background: linear-gradient(135deg, var(--mint-green) 0%, var(--peach-orange) 100%);
            color: var(--primary-brown);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .add-to-cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(194, 242, 208, 0.4);
        }

        .vendor-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--soft-pink);
            color: var(--primary-brown);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--mint-green);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--mint-green);
            color: var(--primary-brown);
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 600;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .notification.show {
            transform: translateX(0);
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                min-height: 500px;
                padding: 30px 25px;
            }
            
            .dashboard-title {
                font-size: 2.2em;
            }
            
            .product-grid {
                grid-template-columns: 1fr;
            }

            .header-actions {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-particles">
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 40%; animation-delay: 3s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 0.5s;"></div>
        <div class="particle" style="left: 80%; animation-delay: 1.5s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 2.5s;"></div>
    </div>

    <div class="notification" id="notification"></div>

    <div class="container">
        <div class="dashboard-header">
            <h1 class="dashboard-title">CUSTOMER HUB</h1>
            <div class="header-actions">
                <button class="cart-btn" onclick="viewCart()">
                    Cart <span class="cart-count" id="cart-count">0</span>
                </button>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </div>
        </div>
        
        <div class="welcome-message">
            <h2>Welcome, Ice Cream Lover</h2>
            <p>Discover our premium artisanal ice cream collection from 4 amazing vendors</p>
        </div>

        <div class="customer-section">
            <h2 class="section-title">Available Flavors</h2>
            <div class="product-grid" id="product-grid">
                <!-- Products will be dynamically generated -->
            </div>
        </div>
    </div>

    <script>
        // Ice cream products data with vendor assignments
        const products = [
            // Vendor 1 Products
            { id: 1, name: "Vanilla Ice Cream", price: 3.50, description: "Classic vanilla flavor made with real Madagascar vanilla beans", emoji: "1f366", vendor: 1 },
            { id: 2, name: "Chocolate Ice Cream", price: 4.00, description: "Rich dark chocolate ice cream with cocoa from Belgium", emoji: "1f36b", vendor: 1 },
            { id: 3, name: "Strawberry Ice Cream", price: 3.75, description: "Fresh strawberry ice cream with real fruit chunks", emoji: "1f353", vendor: 1 },
            { id: 4, name: "Mint Chocolate Chip", price: 4.25, description: "Refreshing mint with premium chocolate chips", emoji: "1f33f", vendor: 1 },
            { id: 5, name: "Rocky Road", price: 4.50, description: "Chocolate ice cream with marshmallows and nuts", emoji: "1faa8", vendor: 1 },

            // Vendor 2 Products
            { id: 6, name: "Pistachio", price: 4.75, description: "Creamy pistachio ice cream with real nuts", emoji: "1f95c", vendor: 2 },
            { id: 7, name: "Cookies and Cream", price: 4.25, description: "Vanilla ice cream with crushed chocolate cookies", emoji: "1f36a", vendor: 2 },
            { id: 8, name: "Caramel Swirl", price: 4.50, description: "Creamy vanilla with rich caramel swirl throughout", emoji: "1f36f", vendor: 2 },
            { id: 9, name: "Mango Sorbet", price: 4.00, description: "Refreshing dairy-free mango sorbet with tropical flavor", emoji: "1f96d", vendor: 2 },
            { id: 10, name: "Salted Caramel", price: 4.75, description: "Sweet and salty caramel ice cream with sea salt crystals", emoji: "1f9c2", vendor: 2 },

            // Vendor 3 Products
            { id: 11, name: "Neapolitan", price: 4.00, description: "Classic trio of vanilla, chocolate, and strawberry", emoji: "1f366", vendor: 3 },
            { id: 12, name: "Butter Pecan", price: 4.50, description: "Rich buttery ice cream with toasted pecan pieces", emoji: "1f330", vendor: 3 },
            { id: 13, name: "Coffee Gelato", price: 4.25, description: "Authentic Italian-style coffee gelato with espresso", emoji: "2615", vendor: 3 },
            { id: 14, name: "Coconut", price: 4.00, description: "Tropical coconut ice cream with shredded coconut flakes", emoji: "1f965", vendor: 3 },
            { id: 15, name: "Blueberry Cheesecake", price: 4.75, description: "Creamy cheesecake ice cream with blueberry swirl and graham cracker pieces", emoji: "1fad0", vendor: 3 },

            // Vendor 4 Products
            { id: 16, name: "Lemon Sorbet", price: 3.50, description: "Refreshing lemon sorbet with real citrus zest", emoji: "1f34b", vendor: 4 },
            { id: 17, name: "Peanut Butter Cup", price: 4.50, description: "Creamy peanut butter ice cream with chocolate peanut butter cups", emoji: "1f95c", vendor: 4 },
            { id: 18, name: "Black Cherry", price: 4.25, description: "Rich cherry ice cream with whole cherry pieces", emoji: "1f352", vendor: 4 },
            { id: 19, name: "Tiramisu", price: 4.75, description: "Italian-inspired tiramisu flavored ice cream with coffee and mascarpone", emoji: "1f36a", vendor: 4 },
            { id: 20, name: "Banana Split", price: 4.00, description: "Banana ice cream with chocolate chips and strawberry swirl", emoji: "1f34c", vendor: 4 }
        ];

        // Cart functionality
        let cart = [];

        function updateCartCount() {
            const cartCount = document.getElementById('cart-count');
            cartCount.textContent = cart.length;
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                updateCartCount();
                showNotification(`${product.name} added to cart!`);
            }
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function redirectToVendor(vendorId) {
            // Redirect to vendor-specific checkout page
            window.location.href = `vendor${vendorId}.html`;
        }

        function viewCart() {
            if (cart.length === 0) {
                showNotification('Your cart is empty!');
                return;
            }
            
            // Create cart summary
            let cartSummary = 'Cart Contents:\n\n';
            let total = 0;
            
            cart.forEach(item => {
                cartSummary += `${item.name} - $${item.price.toFixed(2)}\n`;
                total += item.price;
            });
            
            cartSummary += `\nTotal: $${total.toFixed(2)}`;
            alert(cartSummary);
        }

        function handleLogout() {
            // Clear cart on logout
            cart = [];
            updateCartCount();
            // In a real application, this would clear session data
            window.location.href = 'login.html';
        }

        // Generate product cards dynamically
        function generateProductCards() {
            const productGrid = document.getElementById('product-grid');
            
            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.onclick = () => redirectToVendor(product.vendor);
                
                productCard.innerHTML = `
                    <div class="vendor-badge">V${product.vendor}</div>
                    <div class="product-image">
                        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/${product.emoji}.svg" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <p class="product-description">${product.description}</p>
                        <div class="product-actions">
                            <button class="add-to-cart-btn" onclick="event.stopPropagation(); addToCart(${product.id})">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                `;
                
                productGrid.appendChild(productCard);
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            generateProductCards();
            updateCartCount();
        });
    </script>
</body>
</html>
