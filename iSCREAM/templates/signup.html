<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS ICE - Sign Up</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-brown: #6b3e26;
            --soft-pink: #ffc5d9;
            --mint-green: #c2f2d0;
            --cream-yellow: #fdf5c9;
            --peach-orange: #ffcb85;
            --dark-bg: #0a0a0a;
            --glass-white: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--primary-brown) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, var(--soft-pink) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, var(--mint-green) 0%, transparent 50%),
                radial-gradient(circle at 60% 20%, var(--peach-orange) 0%, transparent 50%);
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 
                0 25px 45px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            min-height: 700px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                var(--soft-pink) 90deg,
                var(--mint-green) 180deg,
                var(--peach-orange) 270deg,
                transparent 360deg
            );
            opacity: 0.05;
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .signup-page {
            padding: 50px 60px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease-in;
        }

        .signup-form {
            max-width: 450px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .signup-form h1 {
            font-family: 'Orbitron', monospace;
            color: var(--cream-yellow);
            margin-bottom: 20px;
            font-size: 3.2em;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 
                0 0 20px var(--peach-orange),
                0 0 40px var(--soft-pink);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px var(--peach-orange), 0 0 40px var(--soft-pink); }
            to { text-shadow: 0 0 30px var(--peach-orange), 0 0 60px var(--soft-pink), 0 0 80px var(--mint-green); }
        }

        .subtitle {
            color: var(--mint-green);
            font-size: 1.2em;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--cream-yellow);
            font-weight: 600;
            font-size: 1.1em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-family: 'Exo 2', sans-serif;
        }

        .form-group select option {
            background: var(--primary-brown);
            color: white;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--mint-green);
            box-shadow: 
                0 0 20px rgba(194, 242, 208, 0.5),
                inset 0 0 10px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .signup-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--peach-orange) 0%, var(--soft-pink) 100%);
            color: var(--primary-brown);
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            letter-spacing: 2px;
            font-family: 'Orbitron', monospace;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .signup-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .signup-btn:hover::before {
            left: 100%;
        }

        .signup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 35px rgba(255, 203, 133, 0.4),
                0 0 40px rgba(255, 197, 217, 0.3);
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .switch-btn {
            background: none;
            border: none;
            color: var(--mint-green);
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: underline;
            font-family: 'Exo 2', sans-serif;
            transition: all 0.3s ease;
        }

        .switch-btn:hover {
            color: var(--cream-yellow);
            text-shadow: 0 0 10px var(--peach-orange);
        }

        .error-message, .success-message {
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
            font-weight: 600;
            animation: slideIn 0.3s ease;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            color: var(--soft-pink);
            border: 1px solid rgba(255, 0, 0, 0.3);
        }

        .success-message {
            background: rgba(0, 255, 0, 0.2);
            color: var(--mint-green);
            border: 1px solid rgba(0, 255, 0, 0.3);
        }

        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--mint-green);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .password-strength {
            margin-top: 5px;
            font-size: 0.9em;
            color: var(--cream-yellow);
        }

        .strength-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak { background: #ff6b6b; }
        .strength-medium { background: var(--peach-orange); }
        .strength-strong { background: var(--mint-green); }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                min-height: 600px;
            }
            
            .signup-page {
                padding: 30px 30px;
            }
            
            .signup-form h1 {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="floating-particles">
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 40%; animation-delay: 3s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 0.5s;"></div>
        <div class="particle" style="left: 80%; animation-delay: 1.5s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 2.5s;"></div>
    </div>

    <div class="container">
        <div class="signup-page">
            <div class="signup-form">
                <h1>WELCOME TO NEXUS</h1>
                <p class="subtitle">Register for Next-Gen Ice Cream Experience</p>
                
                <form id="signupForm" method="POST" action="/signup/">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_role">Account Type:</label>
                        <select id="signupUserType" name="signupUserType" required>
                            <option value="">Select Account Type</option>
                            <option value="owner">Owner</option>
                            <option value="vendor">Vendor</option>
                            <option value="customer">Customer</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="signupFullName">Full Name:</label>
                        <input type="text" id="signupFullName" name="signupFullName" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="signupEmail">Email:</label>
                        <input type="email" id="signupEmail" name="signupEmail" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="signupUsername">Username:</label>
                        <input type="text" id="signupUsername" name="signupUsername" placeholder="Choose a username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="signupPassword">Password:</label>
                        <input type="password" id="signupPassword" name="signupPassword" placeholder="Create a password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="signupConfirmPassword">Confirm Password:</label>
                        <input type="password" id="signupConfirmPassword" name="signupConfirmPassword" placeholder="Confirm your password" required>
                    </div>
                    
                    <button type="submit" class="signup-btn">Create Account</button>
                </form>
                
                <div id="signupErrorMessage" class="error-message"></div>
                <div id="signupSuccessMessage" class="success-message"></div>
                
                <button type="button" class="switch-btn" onclick="window.location.href='/login/'">Already have an account? Sign In</button>
            </div>
        </div>
    </div>

</body>
</html>
